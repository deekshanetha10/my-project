version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: cig_db
    environment:
      POSTGRES_USER: cig_user
      POSTGRES_PASSWORD: cig_password
      POSTGRES_DB: cig_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cig_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: cig_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cig_user:cig_password@db:5432/cig_db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
